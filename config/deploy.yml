# Kamal deploy config. Docs: https://kamal-deploy.org/docs/configuration/overview/
#
# Layout on the server (a Hetzner VPS that also runs CloudPanel and other sites):
#
#   visitor ─https─▶ CloudPanel Nginx :443 ─http─▶ kamal-proxy 127.0.0.1:3080 ─▶ car_wash app container
#                    (TLS via Let's Encrypt,          (zero-downtime swaps)          └▶ car_wash-db (PostGIS)
#                     "Reverse Proxy" site)
#
# CloudPanel already owns ports 80/443 (and 8080/8443), so kamal-proxy listens on 127.0.0.1:3080 only.
# Docker-published ports bypass the ufw firewall, so nothing here is published on a public interface.

service: car_wash
image: car_wash

servers:
  web:
    - autoatelier.erp-eg.com

proxy:
  # TLS is terminated by CloudPanel's Nginx in front of kamal-proxy.
  ssl: false
  host: autoatelier.erp-eg.com
  # Pass X-Forwarded-For/Proto from Nginx through to Rails (real client IPs for rate limits and logs).
  forward_headers: true
  run:
    http_port: 3080
    https_port: 3443
    bind_ips:
      - 127.0.0.1

# Local registry: Kamal runs it on this machine and the server pulls the image through the SSH tunnel,
# so no Docker Hub / GHCR account is needed.
registry:
  server: localhost:5555

env:
  secret:
    - RAILS_MASTER_KEY
    - CAR_WASH_DATABASE_PASSWORD
  clear:
    APP_HOST: autoatelier.erp-eg.com
    # The PostGIS accessory below, reached over Kamal's private Docker network.
    DB_HOST: car_wash-db
    # Run the Solid Queue supervisor inside Puma (single small server).
    SOLID_QUEUE_IN_PUMA: true
    # Shown publicly on /admin/sign_in for portfolio reviewers. The account holds a view-only role
    # ("Portfolio Reviewer": every *.read permission) and is created on the server, not by seeds.
    DEMO_LOGIN_EMAIL: reviewer@autoatelier.erp-eg.com
    DEMO_LOGIN_PASSWORD: AutoAtelier-Demo-2026

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Active Storage uploads (config.active_storage.service = :local) live in /rails/storage.
volumes:
  - "car_wash_storage:/rails/storage"

# Bridge fingerprinted assets between versions to avoid 404s on in-flight requests.
asset_path: /rails/public

builder:
  arch: amd64

accessories:
  db:
    image: postgis/postgis:16-3.5
    host: autoatelier.erp-eg.com
    # No `port:` on purpose: the database is reachable only from containers on Kamal's network.
    env:
      clear:
        POSTGRES_USER: car_wash
        POSTGRES_DB: car_wash_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
