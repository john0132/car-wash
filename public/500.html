<!doctype html>
<html lang="en">
  <head>
    <title>Something went wrong (500) — Auto Atelier</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        background: #f6f1e7;
        color: #2b3a32;
        display: grid;
        min-height: 100dvh;
        place-items: center;
        padding: 2rem;
        text-align: center;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 32rem; }
      .code { color: #8a6240; font-size: 0.8rem; letter-spacing: 0.3em; text-transform: uppercase; }
      h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.1; margin: 1rem 0; }
      p { color: #5b6b5e; line-height: 1.6; }
      a {
        background: #2b3a32; border-radius: 999px; color: #f6f1e7; display: inline-block;
        margin-top: 2rem; padding: 0.8rem 1.8rem; text-decoration: none; font-size: 0.95rem;
      }
      a:hover { background: #1f2b25; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 500</p>
      <h1>Something went wrong</h1>
      <p>We're sorry — something broke on our side.</p>
      <p>Please try again in a moment.</p>
      <a href="/">Back to the homepage</a>
    </main>
  </body>
</html>
